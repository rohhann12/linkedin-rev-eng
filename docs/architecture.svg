<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 780" width="1180" height="780" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0a66c2"/>
    </marker>
    <marker id="arrowWarm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <rect width="1180" height="780" fill="#ffffff"/>

  <text x="40" y="46" font-size="21" font-weight="700" fill="#0f172a">LinkedIn Profile API</text>
  <text x="40" y="68" font-size="13.5" fill="#64748b">Profile URL in, structured JSON out. Strategies chain and merge, so a broken tier costs coverage — not availability.</text>

  <!-- ================= request pipeline ================= -->
  <rect x="40" y="96" width="700" height="176" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="58" y="120" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing="1.2">REQUEST PIPELINE</text>

  <rect x="58" y="134" width="120" height="56" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="118" y="158" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">parse URL</text>
  <text x="118" y="176" font-size="10.5" text-anchor="middle" fill="#64748b">/in/ /pub/ slug</text>

  <rect x="200" y="134" width="120" height="56" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="260" y="158" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">cache</text>
  <text x="260" y="176" font-size="10.5" text-anchor="middle" fill="#64748b">24h TTL</text>

  <rect x="342" y="134" width="120" height="56" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="402" y="158" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">rate limit</text>
  <text x="402" y="176" font-size="10.5" text-anchor="middle" fill="#64748b">per API key</text>

  <rect x="484" y="134" width="238" height="56" rx="7" fill="#eff6ff" stroke="#0a66c2"/>
  <text x="603" y="158" font-size="13" font-weight="600" text-anchor="middle" fill="#0a66c2">strategy chain</text>
  <text x="603" y="176" font-size="10.5" text-anchor="middle" fill="#3b7fc4">tries each, merges all</text>

  <text x="58" y="222" font-size="11.5" fill="#475569">A cache hit is a LinkedIn profile view that never happens — the scarce resource, capped monthly per account.</text>
  <text x="58" y="242" font-size="11.5" fill="#475569">The chain does not stop at first success: a later tier may carry a section an earlier one missed.</text>
  <text x="58" y="262" font-size="11.5" fill="#475569">Every field records which tier produced it in <tspan font-family="ui-monospace, monospace" fill="#0f172a">meta.field_provenance</tspan>.</text>

  <line x1="178" y1="162" x2="196" y2="162" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="162" x2="338" y2="162" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="462" y1="162" x2="480" y2="162" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================= strategies ================= -->
  <rect x="40" y="296" width="700" height="286" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="58" y="320" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing="1.2">STRATEGIES — IN TRUST ORDER</text>

  <rect x="58" y="334" width="664" height="46" rx="7" fill="#eff6ff" stroke="#0a66c2"/>
  <text x="72" y="353" font-size="12.5" font-weight="700" font-family="ui-monospace, monospace" fill="#0a66c2">1. rest</text>
  <text x="150" y="353" font-size="11.5" font-family="ui-monospace, monospace" fill="#0f172a">/identity/dash/profiles?decorationId=FullProfileWithEntities-101</text>
  <text x="72" y="371" font-size="10.5" fill="#475569">PRIMARY — one call, ~68 KB of clean normalised JSON. Decoration version drifts, so candidates are tried in order.</text>

  <rect x="58" y="390" width="664" height="46" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="72" y="409" font-size="12.5" font-weight="700" font-family="ui-monospace, monospace" fill="#334155">2. embedded</text>
  <text x="180" y="409" font-size="11.5" font-family="ui-monospace, monospace" fill="#0f172a">/in/&lt;slug&gt;/ + /details/* — JSON inside the HTML</text>
  <text x="72" y="427" font-size="10.5" fill="#475569">No query hash to maintain, so it cannot rot. Harvests fresh GraphQL hashes, repairing the tier below it.</text>

  <rect x="58" y="446" width="664" height="46" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="72" y="465" font-size="12.5" font-weight="700" font-family="ui-monospace, monospace" fill="#334155">3. graphql</text>
  <text x="180" y="465" font-size="11.5" font-family="ui-monospace, monospace" fill="#0f172a">/voyager/api/graphql?queryId=…&lt;32-hex&gt;</text>
  <text x="72" y="483" font-size="10.5" fill="#475569">Fast path. 500s unless the hash matches the current build, so it reports "skipped" rather than failing.</text>

  <rect x="58" y="502" width="326" height="46" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="72" y="521" font-size="12.5" font-weight="700" font-family="ui-monospace, monospace" fill="#64748b">4. dom</text>
  <text x="146" y="521" font-size="11" fill="#475569">cheerio, reuses fetched HTML</text>
  <text x="72" y="539" font-size="10.5" fill="#475569">Zero extra requests. Lower accuracy by design.</text>

  <rect x="396" y="502" width="326" height="46" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="410" y="521" font-size="12.5" font-weight="700" font-family="ui-monospace, monospace" fill="#64748b">5. assisted</text>
  <text x="500" y="521" font-size="11" fill="#475569">off unless a key is set</text>
  <text x="410" y="539" font-size="10.5" fill="#475569">Schema-drift rescue. Output re-validated.</text>

  <text x="58" y="570" font-size="11.5" fill="#475569"><tspan font-weight="600" fill="#c2410c">Retired:</tspan> <tspan font-family="ui-monospace, monospace">profileView</tspan> → 410 Gone.  The flagship web app is RSC/SDUI and issues no data API calls on load.</text>

  <!-- ================= normalisation ================= -->
  <rect x="764" y="296" width="376" height="286" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="782" y="320" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing="1.2">NORMALISATION</text>

  <rect x="782" y="334" width="340" height="62" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="796" y="356" font-size="12.5" font-weight="600" fill="#0f172a">URN graph resolver</text>
  <text x="796" y="374" font-size="10.5" fill="#475569">Rest.li ships a flat <tspan font-family="ui-monospace, monospace">included[]</tspan> pool; <tspan font-family="ui-monospace, monospace">*</tspan>-prefixed</text>
  <text x="796" y="388" font-size="10.5" fill="#475569">keys are URN pointers. Rebuilt into a tree.</text>

  <rect x="782" y="408" width="340" height="62" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="796" y="430" font-size="12.5" font-weight="600" fill="#0f172a">entity mappers</text>
  <text x="796" y="448" font-size="10.5" fill="#475569">Selected by <tspan font-family="ui-monospace, monospace">$type</tspan> AND URN type — matching</text>
  <text x="796" y="462" font-size="10.5" fill="#475569">only one yields a silent, empty 200.</text>

  <rect x="782" y="482" width="340" height="66" rx="7" fill="#eff6ff" stroke="#0a66c2"/>
  <text x="796" y="504" font-size="12.5" font-weight="600" fill="#0a66c2">canonical schema (Zod)</text>
  <text x="796" y="522" font-size="10.5" fill="#3b7fc4">Every scalar nullable, every list defaulted.</text>
  <text x="796" y="536" font-size="10.5" fill="#3b7fc4">Dates structured — LinkedIn stores no day.</text>

  <text x="782" y="570" font-size="11.5" fill="#475569">One resolver + one mapper set serves every strategy.</text>

  <line x1="742" y1="357" x2="778" y2="357" stroke="#0a66c2" stroke-width="1.5" marker-end="url(#arrowAccent)"/>

  <!-- ================= session lane ================= -->
  <rect x="764" y="96" width="376" height="176" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="782" y="120" font-size="10.5" font-weight="700" fill="#c2410c" letter-spacing="1.2">SESSION — STATE, NOT CONFIG</text>

  <rect x="782" y="134" width="158" height="56" rx="7" fill="#ffffff" stroke="#fdba74"/>
  <text x="861" y="155" font-size="12" font-weight="600" text-anchor="middle" fill="#9a3412">your laptop</text>
  <text x="861" y="172" font-size="10" text-anchor="middle" fill="#c2410c">Playwright, trusted IP</text>

  <rect x="964" y="134" width="158" height="56" rx="7" fill="#ffffff" stroke="#fdba74"/>
  <text x="1043" y="155" font-size="12" font-weight="600" text-anchor="middle" fill="#9a3412">cookie jar</text>
  <text x="1043" y="172" font-size="10" text-anchor="middle" fill="#c2410c">persisted, rotating</text>

  <line x1="940" y1="162" x2="960" y2="162" stroke="#c2410c" stroke-width="1.5" marker-end="url(#arrowWarm)"/>
  <text x="950" y="132" font-size="9.5" text-anchor="middle" fill="#c2410c">once</text>

  <text x="782" y="216" font-size="11" fill="#7c2d12">Login happens once, on an IP LinkedIn trusts — never on the</text>
  <text x="782" y="232" font-size="11" fill="#7c2d12">server, whose datacenter IP reliably triggers checkpoints.</text>
  <text x="782" y="252" font-size="11" fill="#7c2d12">After that, every response's <tspan font-family="ui-monospace, monospace" font-weight="600">Set-Cookie</tspan> is merged back in,</text>
  <text x="782" y="268" font-size="11" fill="#7c2d12">so the session renews itself indefinitely. No password on-box.</text>

  <path d="M 1043 190 L 1043 214 L 603 214 L 603 130" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowWarm)"/>

  <!-- ================= footer ================= -->
  <rect x="40" y="606" width="1100" height="140" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="58" y="630" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing="1.2">WHAT LIMITS THIS — AND IT IS NOT THE PARSER</text>

  <rect x="58" y="644" width="352" height="84" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="72" y="666" font-size="12" font-weight="600" fill="#0f172a">Visibility</text>
  <text x="72" y="686" font-size="10.5" fill="#475569">Out-of-network profiles return the "LinkedIn</text>
  <text x="72" y="700" font-size="10.5" fill="#475569">Member" placeholder — no name, no positions.</text>
  <text x="72" y="718" font-size="10.5" font-family="ui-monospace, monospace" fill="#c2410c">→ PROFILE_NOT_VISIBLE, not a silent empty</text>

  <rect x="424" y="644" width="352" height="84" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="438" y="666" font-size="12" font-weight="600" fill="#0f172a">Commercial Use Limit</text>
  <text x="438" y="686" font-size="10.5" fill="#475569">A fixed number of distinct profile views per</text>
  <text x="438" y="700" font-size="10.5" fill="#475569">account per month. Past it, everything paywalls.</text>
  <text x="438" y="718" font-size="10.5" font-family="ui-monospace, monospace" fill="#c2410c">→ cache and rate limit exist for this</text>

  <rect x="790" y="644" width="350" height="84" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="804" y="666" font-size="12" font-weight="600" fill="#0f172a">Impermanence</text>
  <text x="804" y="686" font-size="10.5" fill="#475569">Voyager is being retired section by section.</text>
  <text x="804" y="700" font-size="10.5" fill="#475569">Any single path will break; the chain assumes it.</text>
  <text x="804" y="718" font-size="10.5" font-family="ui-monospace, monospace" fill="#c2410c">→ degrade, never hard-fail</text>
</svg>
